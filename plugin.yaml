name: workstreamer
version: 0.4.0
description: "Workstreamer — maintain dabbo-state workstream standards (skill + hooks + slash + Desktop UI)"
manifest_version: 1
provides_tools: []
provides_hooks:
  - pre_tool_call
  - on_session_end
  - on_session_finalize
provides_commands:
  - workstream
  - stream
  - ws
# NOTE: dashboard backend is discovered from dashboard/manifest.json
# (api: "plugin_api.py"), NOT from this field. Kept for documentation only.
dashboard:
  api: "dashboard/plugin_api.py"
